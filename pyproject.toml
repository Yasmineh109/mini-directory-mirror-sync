[project]
name = "mini-directory-mirror-sync"
version = "0.1.0"
description = "Synchronizes a destination directory with a source, copying changed files and deleting removed ones."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
